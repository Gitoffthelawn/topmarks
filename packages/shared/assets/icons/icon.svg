<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 128 128"
  width="128"
  height="128"
>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Rounded-square background with gradient -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />

  <!-- Subtle bokeh hinting at the wallpaper feature -->
  <circle cx="40" cy="100" r="20" fill="white" fill-opacity="0.12" />
  <circle cx="92" cy="78" r="14" fill="white" fill-opacity="0.10" />

  <!-- The bookmarks bar -->
  <rect
    x="14"
    y="22"
    width="100"
    height="22"
    rx="11"
    fill="white"
    fill-opacity="0.95"
  />

  <!-- Skeleton text marks suggesting bookmark titles -->
  <rect x="22" y="30" width="14" height="5" rx="2" fill="#94a3b8" />
  <rect x="42" y="30" width="18" height="5" rx="2" fill="#94a3b8" />
  <rect x="64" y="30" width="12" height="5" rx="2" fill="#94a3b8" />
  <rect x="82" y="30" width="20" height="5" rx="2" fill="#94a3b8" />
</svg>
